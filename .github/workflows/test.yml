name: "Build and Test"
on:
  pull_request:

jobs:
  test:
    permissions:
      pull-requests: write

    strategy:
      matrix:
        include:
          - ref: ${{ github.head_ref }}
            repo: ${{ github.event.pull_request.head.repo.full_name }}
            kind: incoming
          - ref: ${{ github.event.pull_request.base.ref }}
            repo: ${{ github.event.pull_request.base.repo.full_name }}
            kind: base

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ matrix.ref }}
          ## Set repository to correctly checkout from forks
          repository: ${{ matrix.repo }}
      - name: "Install Node"
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.x"
          cache: "npm"
      - name: "Install Deps"
        run: npm ci
      - name: "Test"
        run: npm run test:coverage
      - name: "Upload Coverage"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: "coverage-${{ matrix.kind }}"
          path: coverage

  build-and-report:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: "Install Node"
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.x"
          cache: "npm"
      - name: "Install Deps"
        run: npm ci
      - name: "Build"
        run: npm run build
      # Remove node_modules to see if this action runs entirely compiled
      - name: "Remove Node Modules"
        run: rm -rf node_modules

      - name: "Download Coverage Artifacts for ${{ github.head_ref}}"
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: coverage-incoming
          path: coverage 

      - name: "Download Coverage Artifacts for main"
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: coverage-base
          path: coverage-base

      - name: "Test Action by generating coverage"
        uses: ./
        with:
          file-coverage-mode: "all"
          json-summary-compare-path: coverage-base/coverage-summary.json
          comment-on: 'pr,commit'
          threshold-icons: '{"0": "🔴", "74": "🟠", "75": "🟢"}'

      - name: "Upload build"
        if: env.ACTIONS_STEP_DEBUG == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dist
          path: dist
